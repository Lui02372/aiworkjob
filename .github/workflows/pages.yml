name: Verify and publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: npm run refresh:feed
      - run: npm run build:pages
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/check_pages.py
        env:
          AIWORKJOB_BROWSER_CHANNEL: ''
      - run: python tests/check_commerce.py
        env:
          AIWORKJOB_BROWSER_CHANNEL: ''
      - run: python tests/check_account_manager.py
        env:
          AIWORKJOB_BROWSER_CHANNEL: ''
      - run: python tests/check_maintenance.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified app
        id: deployment
        uses: actions/deploy-pages@v5
